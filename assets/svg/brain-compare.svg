
<svg viewBox="0 0 720 280" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="生物腦與第二大腦對照">
  <rect width="720" height="280" rx="16" fill="#faf8f5"/>
  <rect x="30" y="40" width="300" height="200" rx="14" fill="#ede4f5" stroke="#5b2d8e" stroke-width="2"/>
  <rect x="390" y="40" width="300" height="200" rx="14" fill="#d9f5f1" stroke="#0d9488" stroke-width="2"/>
  <text x="180" y="75" text-anchor="middle" fill="#5b2d8e" font-size="18" font-weight="700" font-family="Noto Sans TC,sans-serif">生物大腦</text>
  <text x="540" y="75" text-anchor="middle" fill="#0d9488" font-size="18" font-weight="700" font-family="Noto Sans TC,sans-serif">第二大腦</text>
  <text x="180" y="115" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">容量有限 · 易遺忘</text>
  <text x="180" y="140" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">擅長直覺與判斷</text>
  <text x="180" y="165" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">情緒與身體感知</text>
  <text x="180" y="190" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">創造力的發動機</text>
  <text x="540" y="115" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">近乎無限儲存</text>
  <text x="540" y="140" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">可搜尋、可連結</text>
  <text x="540" y="165" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">可傳承、可協作 AI</text>
  <text x="540" y="190" text-anchor="middle" fill="#4a4a5a" font-size="13" font-family="Noto Sans TC,sans-serif">釋放大腦去做思考</text>
  <path d="M340 140 H380" stroke="#1a1a2e" stroke-width="2" marker-end="url(#arrow)"/>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#1a1a2e"/></marker></defs>
  <text x="360" y="128" text-anchor="middle" fill="#1a1a2e" font-size="12" font-family="Noto Sans TC,sans-serif">配合</text>
</svg>
